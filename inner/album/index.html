<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://yluna-meet-20261124-default-rtdb.asia-southeast1.firebasedatabase.app; img-src blob:; base-uri 'none'; form-action 'none'">
  <title>朋友相册 · yluna 的里站</title>
  <link rel="stylesheet" href="album.css">
  <script src="album.js?v=gallery3" defer></script>
</head>
<body>
  <main>
    <nav aria-label="当前位置"><a href="/inner/">里站</a> / <a id="album-directory" href="/gallery/?mode=inner">相册</a> / 朋友相册</nav>
    <h1>朋友相册</h1>
    <p id="invite-notice" hidden>这是我单独发出的邀请。我能看到这条邀请的使用时间和成功打开次数。</p>
    <p id="status" role="status">请用我私下发给你的完整邀请链接打开相册。</p>
    <form id="unlock-form" hidden>
      <label for="invitation">粘贴我发给你的相册邀请链接</label>
      <input id="invitation" type="password" required autocomplete="off" spellcheck="false">
      <button type="submit">打开相册</button>
    </form>
    <div id="albums"></div>
    <p><a href="/feedback/" referrerpolicy="no-referrer">给我提建议 ↗</a></p>
  </main>
  <dialog aria-labelledby="photo-title">
    <header><strong id="photo-title"></strong><button id="close" autofocus>关闭</button></header>
    <img id="full" alt="">
    <p id="caption"></p>
    <footer><button id="prev">上一张</button><span id="count"></span><button id="next">下一张</button></footer>
  </dialog>
</body>
</html>
