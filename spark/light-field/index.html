<script>
(() => {
  'use strict';
/*
 * Opening geometry for the hero field.
 * Both makers are self-contained: no DOM globals are touched until the
 * canvas-based letter maker is called, and no other scripts are required.
 */

function makeOpeningRings(count, random) {
  const requested = Number(count);
  const total = Number.isFinite(requested) ? Math.max(0, Math.floor(requested)) : 0;
  const out = new Float32Array(total * 3);
  if (!total) return out;

  const rnd = typeof random === 'function'
    ? random
    : (random && typeof random.next === 'function'
      ? function () { return random.next(); }
      : Math.random);

  const rings = 9;
  const innerRadius = 0.51;
  const outerRadius = 1.08;
  const tau = Math.PI * 2;
  const perRing = new Array(rings);
  const base = Math.floor(total / rings);
  let remainder = total - base * rings;

  for (let ring = 0; ring < rings; ring++) {
    perRing[ring] = base + (remainder > 0 ? 1 : 0);
    if (remainder > 0) remainder--;
  }

  let index = 0;
  for (let ring = 0; ring < rings; ring++) {
    const t = ring / (rings - 1);
    const radius = innerRadius + (outerRadius - innerRadius) * t;
    const pointCount = perRing[ring];
    const phase = rnd() * tau;
    const step = pointCount ? tau / pointCount : 0;

    // Every layer gets its own small depth and inclination. The tilts are
    // deliberately tiny so the central opening stays clear at every layer.
    const tiltX = (rnd() - 0.5) * 0.22;
    const tiltY = (rnd() - 0.5) * 0.22;
    const depth = (ring - (rings - 1) / 2) * 0.032 + (rnd() - 0.5) * 0.024;
    const cosX = Math.cos(tiltX);
    const sinX = Math.sin(tiltX);
    const cosY = Math.cos(tiltY);
    const sinY = Math.sin(tiltY);

    for (let point = 0; point < pointCount; point++, index++) {
      const angle = phase + (point + (rnd() - 0.5) * 0.4) * step;
      const jitteredRadius = radius + (rnd() - 0.5) * 0.026;
      const localX = Math.cos(angle) * jitteredRadius;
      const localY = Math.sin(angle) * jitteredRadius;

      // Tilt about Y, then about X, then offset the whole layer in Z.
      const tiltedX = localX * cosY;
      const yIntoZ = localX * sinY;
      const tiltedY = localY * cosX - yIntoZ * sinX;
      const tiltedZ = localY * sinX + yIntoZ * cosX + depth;
      const offset = index * 3;

      out[offset] = tiltedX;
      out[offset + 1] = tiltedY;
      out[offset + 2] = tiltedZ;
    }
  }

  return out;
}

function makeAILetters(count, random) {
  const requested = Number(count);
  const total = Number.isFinite(requested) ? Math.max(0, Math.floor(requested)) : 0;
  const out = new Float32Array(total * 3);
  if (!total) return out;

  const rnd = typeof random === 'function'
    ? random
    : (random && typeof random.next === 'function'
      ? function () { return random.next(); }
      : Math.random);

  const width = 760;
  const height = 500;
  let canvas = null;
  let ctx = null;

  // Prefer a detached DOM canvas for broad support; OffscreenCanvas is the
  // fallback when there is no document (workers, for example).
  if (typeof document !== 'undefined' && document.createElement) {
    canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    ctx = canvas.getContext('2d', { willReadFrequently: true });
  }
  if (!ctx && typeof OffscreenCanvas !== 'undefined') {
    canvas = new OffscreenCanvas(width, height);
    ctx = canvas.getContext('2d', { willReadFrequently: true });
  }
  if (!ctx) return out;

  const fontSize = 380;
  const sans = '"Arial Black", Arial, Helvetica, sans-serif';
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '900 ' + fontSize + 'px ' + sans;

  const metrics = ctx.measureText('A');
  const ascent = metrics.actualBoundingBoxAscent > 0
    ? metrics.actualBoundingBoxAscent
    : fontSize * 0.72;
  const descent = metrics.actualBoundingBoxDescent > 0
    ? metrics.actualBoundingBoxDescent
    : 0;
  const capHeight = ascent + descent;
  const advance = metrics.width > 0 ? metrics.width : fontSize * 0.72;
  const gap = fontSize * 0.10;
  const barWidth = fontSize * 0.27;
  const stemWidth = fontSize * 0.13;
  const barThickness = capHeight * 0.145;
  const baseline = Math.round((height - capHeight) / 2 + ascent);
  const startX = Math.round((width - (advance + gap + barWidth)) / 2);
  const top = baseline - capHeight;

  // The A comes from a heavy sans face. The I is assembled from rectangles
  // so its upper and lower crossbars are guaranteed to be present.
  ctx.fillText('A', startX, baseline);
  const iLeft = startX + advance + gap;
  const iCenter = iLeft + barWidth / 2;
  ctx.fillRect(Math.round(iCenter - stemWidth / 2), Math.round(top), Math.round(stemWidth), Math.round(capHeight));
  ctx.fillRect(Math.round(iLeft), Math.round(top), Math.round(barWidth), Math.round(barThickness));
  ctx.fillRect(Math.round(iLeft), Math.round(baseline - barThickness), Math.round(barWidth), Math.round(barThickness));

  let image = null;
  try {
    image = ctx.getImageData(0, 0, width, height);
  } catch (error) {
    return out;
  }

  const data = image.data;
  const pixelsX = [];
  const pixelsY = [];
  let minX = width;
  let maxX = -1;
  let minY = height;
  let maxY = -1;

  for (let y = 0; y < height; y++) {
    const row = y * width * 4;
    for (let x = 0; x < width; x++) {
      if (data[row + x * 4 + 3] > 96) {
        pixelsX.push(x);
        pixelsY.push(y);
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  const candidates = pixelsX.length;
  if (!candidates) return out;

  const spanX = maxX - minX + 1;
  const spanY = maxY - minY + 1;
  const targetWidth = 2.05;
  const targetHeight = 1.35;
  const zJitter = 0.06;

  for (let i = 0; i < total; i++) {
    const pick = Math.min(candidates - 1, Math.floor(rnd() * candidates));
    // Jitter inside the sampled pixel cell, then fit the full ink bounds to
    // the requested composition size so the result stays centred on (0, 0).
    const sx = (pixelsX[pick] + rnd() - minX) / spanX - 0.5;
    const sy = 0.5 - (pixelsY[pick] + rnd() - minY) / spanY;
    const offset = i * 3;

    out[offset] = sx * targetWidth;
    out[offset + 1] = sy * targetHeight;
    out[offset + 2] = (rnd() - 0.5) * zJitter;
  }

  return out;
}

  const canvas = document.querySelector('#field');
  const ctx = canvas.getContext('2d');
  const shapes = [
    ['光环','LIGHT RINGS','◎'], ['AI','PARTICLE TYPE','A'],
    ['环结','TORUS KNOT','∞'], ['星系','SPIRAL GALAXY','✧'], ['波面','WAVE FIELD','≈'],
    ['球壳','ORBITAL SHELL','⊙'], ['光','LIGHT GLYPH','光']
  ];
  const group = document.querySelector('.shapes');
  const motion = document.querySelector('#motion');
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  let paused = motionPreference.matches;
  const tau = Math.PI * 2, rows = 168, cols = 34, count = rows * cols;
  const goals = shapes.map(() => new Float32Array(count * 3));
  const current = new Float32Array(count * 3), source = new Float32Array(count * 3);
  const offsetX = new Float32Array(count), offsetY = new Float32Array(count);
  const velX = new Float32Array(count), velY = new Float32Array(count);
  const screenX = new Float32Array(count), screenY = new Float32Array(count);
  const tones = new Uint8Array(count);
  const ink = ['#3e56ad','#566fde','#7287ff','#8fa8ff','#c1d1ff','#e5f1ff','#a4a2ff','#b9a0ff'];
  let seed = 974;
  function random(){ seed = (Math.imul(1664525,seed) + 1013904223) >>> 0; return seed / 4294967296; }
  const glyph = document.createElement('canvas');
  glyph.width = glyph.height = 320;
  const gc = glyph.getContext('2d');
  gc.font = '800 270px "PingFang SC","Microsoft YaHei",sans-serif';
  gc.textBaseline = 'middle'; gc.textAlign = 'center'; gc.fillStyle = '#fff';
  gc.fillText('光',160,164);
  const glyphData = gc.getImageData(0,0,320,320).data, glyphPoints = [];
  for(let y=0;y<320;y+=2) for(let x=0;x<320;x+=2)
    if(glyphData[(y*320+x)*4+3]>100) glyphPoints.push([(x-160)/126,(y-160)/126]);
  for(let i=0;i<count;i++){
    const k=i*3, u=(Math.floor(i/cols)+random()*.20)/rows*tau, v=(i%cols+random()*.22)/cols*tau;
    const c=Math.cos(u*2), s=Math.sin(u*2), c3=Math.cos(u*3), s3=Math.sin(u*3);
    const rad=.82+.31*c3, tube=.132, profile=tube*Math.cos(v);
    goals[2].set([(rad+profile)*c, (rad+profile)*s*.75 + .28*s3, .55*s3+tube*Math.sin(v)],k);
    const r=Math.pow(random(),.61), arm=(i%3)*tau/3+r*4.4+(random()-.5)*(.55+.28*r);
    goals[3].set([1.27*r*Math.cos(arm),.58*r*Math.sin(arm)+(random()-.5)*.075,.50*r*Math.sin(arm)+(random()-.5)*.13],k);
    const x=u/Math.PI-1,z=v/Math.PI-1;
    goals[4].set([x+.22*z,.33*z+Math.sin(x*4.6+z*3.8)*.26+Math.cos(x*2.3-z*4)*.11,z*.55],k);
    const latitude=Math.asin(2*(i+.5)/count-1), longitude=i*2.39996323;
    const radius=.91+.040*Math.cos(latitude*18+longitude*2);
    goals[5].set([radius*Math.cos(latitude)*Math.cos(longitude),radius*Math.sin(latitude),radius*Math.cos(latitude)*Math.sin(longitude)],k);
    const p=glyphPoints[Math.floor(random()*glyphPoints.length)] || [x,z];
    goals[6].set([p[0]+(random()-.5)*.016,p[1],(random()-.5)*.1],k);
    tones[i]= Math.floor(random()*8);
  }
  goals[0] = makeOpeningRings(count,random);
  goals[1] = makeAILetters(count,random);
  // Letter geometry uses upward-positive Y. Canvas projection uses downward-positive Y.
  for(let i=1;i<goals[1].length;i+=3) goals[1][i]*=-1;
  const openingColors = ['#ffc77e','#ff997e','#ff91b5','#d795ed','#ac9cff','#82abff','#77cddb','#99dcd5'];
  const flow = Float32Array.from({length:count},random);
  let openingAt = 2.4;
  current.set(goals[0]);
  const stars=Array.from({length:130},()=>[random(),random(),random()]);
  let selected=0, morph=1, clock=0, last=0, frame=0, w,h,scale,cx,cy;
  let mouse=null, ripple=null;
  function resize(){
    const bounds=canvas.getBoundingClientRect(); w=bounds.width;h=bounds.height;
    const dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);const small=w<=680;
    cx=w*(small?.50:.667);cy=h*(small?.548:.471);
    scale=small?Math.min(w*.354,h*.201):Math.min(w*.209,h*.332);
    request();
  }
  let heroVisible = true;
  function request(){ if(!frame && heroVisible && !document.hidden)frame=requestAnimationFrame(draw); }
  function clearOffsets(){offsetX.fill(0);offsetY.fill(0);velX.fill(0);velY.fill(0);ripple=null;}
  function draw(ts){
    frame=0;const dt=last?Math.min((ts-last)/1000,.04):1/60;last=ts;
    const step=dt*60;
    if(!paused){
      clock+=dt;
      if(openingAt !== null && clock >= openingAt) select(1);
      morph=Math.min(1,morph+dt/(selected===1?1.9:1.12));
    }
    const eased=morph*morph*(3-2*morph);
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#90a8df';
    for(const [x,y,a] of stars){ctx.globalAlpha=.11+a*.46;ctx.fillRect(x*w,y*h,a>.9?1.7:1,a>.9?1.7:1);}
    ctx.globalAlpha=1;
    const angle=((selected===1 || selected===6)?.045:.29)*Math.sin(clock*.22);
    const cosine=Math.cos(angle), sine=Math.sin(angle), roll=selected===1 || selected===6?0:-.24;
    const cr=Math.cos(roll),sr=Math.sin(roll);
    const layers=ink.map(()=>new Path2D());
    const decay=Math.pow(.86,step), goal=goals[selected];
    for(let i=0;i<count;i++){
      const k=i*3;
      let progress=eased, arc=0;
      if(selected===1 && morph<1){
        const t=Math.min(1,Math.max(0,(morph-flow[i]*.24)/.76));
        progress=t*t*(3-2*t);
        arc=4*progress*(1-progress);
      }
      for(let j=0;j<3;j++)current[k+j]=source[k+j]+(goal[k+j]-source[k+j])*progress;
      if(arc){
        const swirl=arc*(flow[i]-.5);
        current[k]+=source[k+1]*swirl;
        current[k+1]-=source[k]*swirl;
      }
      const x=current[k]*cosine+current[k+2]*sine, y=current[k+1], z=current[k+2]*cosine-current[k]*sine;
      const perspective=1/(1.07-z*.14);
      const px=cx+(x*cr-y*sr)*scale*perspective, py=cy+(x*sr+y*cr)*scale*perspective;
      if(!paused){
        if(mouse){
          const dx=px+offsetX[i]-mouse.x,dy=py+offsetY[i]-mouse.y,d2=dx*dx+dy*dy;
          if(d2<6600){const d=Math.max(1,Math.sqrt(d2)),force=(1-d/82)*2.95;velX[i]+=dx/d*force*step;velY[i]+=dy/d*force*step;}
        }
        velX[i]=(velX[i]-offsetX[i]*.055*step)*decay;velY[i]=(velY[i]-offsetY[i]*.055*step)*decay;
        offsetX[i]+=velX[i]*step;offsetY[i]+=velY[i]*step;
      }
      const sx=px+offsetX[i],sy=py+offsetY[i];screenX[i]=sx;screenY[i]=sy;
      let band=Math.max(0,Math.min(5,Math.floor(2.7+2.75*z+(tones[i]-3.5)*.52)));
      if(y>.14 && tones[i]>5)band=tones[i];
      const size=Math.max(.65,Math.min(1.43,scale/177))*(.90+.18*tones[i]+.25*z);
      if(selected<2){
        const hue=Math.atan2(y,x)/tau+1.48+clock*.022+flow[i]*.06;
        band=Math.floor((hue%1)*openingColors.length);
      }
      layers[band].rect(sx,sy,size,size);
    }
    for(let i=0;i<ink.length;i++){ctx.fillStyle=(selected<2?openingColors:ink)[i];ctx.fill(layers[i]);}
    if(ripple){const age=clock-ripple.time;if(age<.75){
      ctx.beginPath();ctx.arc(ripple.x,ripple.y,12+age*115,0,tau);ctx.strokeStyle='rgba(203,252,143,'+(.52*(1-age/.75))+')';ctx.lineWidth=1;ctx.stroke();
    }else ripple=null;}
    if(!paused)request();
  }
  function select(i){
    openingAt=i===0?clock+2.4:null;
    if(i===selected)return;
    source.set(current);selected=i;morph=paused?1:0;
    buttons.forEach((b,n)=>b.setAttribute('aria-pressed',String(i===n)));
    document.querySelector('#english').textContent=shapes[i][1];document.querySelector('#name').textContent=shapes[i][0];
    document.querySelector('#figure').textContent=String(i+1).padStart(2,'0');request();
  }
  const buttons=shapes.map(([name,,icon],i)=>{
    const b=document.createElement('button');b.className='shape';b.type='button';b.setAttribute('aria-pressed',String(i===0));
    const mark=document.createElement('i');mark.setAttribute('aria-hidden','true');mark.textContent=icon;
    b.append(mark,document.createTextNode(name));b.addEventListener('click',()=>select(i));group.append(b);return b;
  });
  function setPaused(value){
    paused=value;motion.setAttribute('aria-pressed',String(paused));motion.querySelector('.motion-label').textContent=paused?'继续动效':'暂停动效';
    motion.querySelector('.motion-icon').textContent=paused?'▷':'Ⅱ';last=0;request();
  }
  motion.addEventListener('click',()=>setPaused(!paused));motionPreference.addEventListener('change',e=>setPaused(e.matches));
  document.addEventListener('keydown',e=>{if(!e.metaKey&&!e.altKey&&!e.ctrlKey && /^[1-7]$/.test(e.key))select(Number(e.key)-1);});
  function point(e){const b=canvas.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};}
  canvas.addEventListener('pointermove',e=>{mouse=point(e);});
  canvas.addEventListener('pointerleave',()=>mouse=null);
  canvas.addEventListener('pointercancel',()=>mouse=null);
  let down=null;
  canvas.addEventListener('pointerdown',e=>{down=point(e);mouse=down;});
  canvas.addEventListener('pointerup',e=>{
    const p=point(e);if(e.pointerType!=='mouse')mouse=null;
    if(paused || !down || Math.hypot(p.x-down.x,p.y-down.y)>14){down=null;return;}
    down=null;ripple={...p,time:clock};
    for(let i=0;i<count;i++){
      const dx=screenX[i]-p.x,dy=screenY[i]-p.y,d=Math.max(1,Math.hypot(dx,dy));
      const impulse=4+37*Math.exp(-d/(scale*.83));velX[i]+=dx/d*impulse;velY[i]+=dy/d*impulse;
    }
    request();
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;}else{last=0;request();}});
  window.addEventListener('resize',()=>{clearOffsets();resize();});
  new IntersectionObserver(([entry])=>{
    heroVisible=entry.isIntersecting;
    if(heroVisible){ last=0;request(); }
    else { cancelAnimationFrame(frame);frame=0;mouse=null; }
  }).observe(canvas);
  resize();setPaused(paused);
})();

</script>
<script>
(() => {
  const hero = document.querySelector('#field-top');
  const heading = document.querySelector('.reading-head');
  const paragraph = document.querySelector('#reading-copy');
  const diagram = document.querySelector('#spectrum');
  const motion = document.querySelector('#motion');
  const fullText = paragraph.textContent;
  const spoken = document.createElement('span');
  spoken.className = 'spoken';
  spoken.textContent = fullText;
  const line = document.createElement('span');
  line.setAttribute('aria-hidden','true');
  const letters = Array.from(fullText, char => {
    const letter = document.createElement('span');
    letter.textContent = char;
    line.append(letter);
    return letter;
  });
  paragraph.replaceChildren(spoken,line);
  const clamp = value => Math.max(0, Math.min(1,value));
  let scheduled = false;
  let lastDiagram = '';
  let previousLit = -1;
  function drawSpectrum(progress) {
    const width = diagram.clientWidth, height = diagram.clientHeight;
    if(!width || !height) return;
    const ratio = Math.min(devicePixelRatio || 1,2);
    const phase = Math.round(progress*90);
    const key = [width,height,phase,ratio].join('/');
    if(key === lastDiagram) return;
    lastDiagram = key;
    const px = Math.round(width*ratio), py = Math.round(height*ratio);
    if(diagram.width !== px || diagram.height !== py){ diagram.width=px;diagram.height=py; }
    const ctx = diagram.getContext('2d');
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.clearRect(0,0,width,height);
    const gradient = ctx.createLinearGradient(0,0,width,0);
    for(const [stop,color] of [[0,'#435629'],[.26,'#73a139'],[.53,'#dc744e'],[.75,'#9c5baf'],[1,'#3b5994']]) gradient.addColorStop(stop,color);
    ctx.strokeStyle=gradient; ctx.lineWidth=1.15;
    for(let strand=0;strand<58;strand++) {
      const offset = (strand/57-.5);
      ctx.beginPath();
      for(let sample=0;sample<=115;sample++){
        const u=sample/115, theta=u*6.65+offset*2.7+phase*.009;
        const envelope=.5+.5*Math.sin(Math.PI*u);
        const x=(.016+.968*u)*width;
        const y=(.5+Math.sin(theta)*envelope*.31+offset*.22)*height;
        if(sample===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }
  function update() {
    scheduled=false;
    const height = document.documentElement.clientHeight;
    const still = motion.getAttribute('aria-pressed')==='true';
    const heroBox = hero.getBoundingClientRect();
    const exit = still ? 0 : clamp(-heroBox.top/(heroBox.height*.50));
    hero.style.setProperty('--title-alpha',1-exit);
    hero.style.setProperty('--title-lift',(-26*exit)+'px');
    const headTop=heading.offsetParent.getBoundingClientRect().top+heading.offsetTop;
    const enter = still ? 1 : clamp((height*.97-headTop)/(height*.42));
    heading.style.setProperty('--enter',enter);
    heading.style.setProperty('--lift',(1-enter)*36+'px');
    const box=paragraph.getBoundingClientRect();
    const range=Math.max(height*.42,box.height*.90);
    const lit=still?letters.length:clamp((height*.85-box.top)/range)*letters.length;
    if(previousLit!==lit) {
      for(let i=0;i<letters.length;i++){
        const weight=still?1:clamp((lit-i)/3+.67);
        letters[i].style.opacity=(.22+.78*weight).toFixed(3);
      }
      previousLit=lit;
    }
    if(headTop < height && headTop + heading.offsetHeight > 0)
      drawSpectrum(still?.5:clamp((height-headTop)/(height+heading.offsetHeight)));
  }
  function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(update);}}
  window.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule);
  new MutationObserver(schedule).observe(motion,{attributes:true,attributeFilter:['aria-pressed']});
  update();
})();

</script>
</body>
